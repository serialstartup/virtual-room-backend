name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test
      
    - name: Run linting
      run: npm run lint || echo "No lint script found"
      
    - name: Check build
      run: npm run build || echo "No build script found"

  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level moderate
      
    - name: Run vulnerability scan
      run: npm audit fix --dry-run

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: docker build -t virtual-room-backend:${{ github.sha }} .
      
    - name: Test Docker image
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        FASHION_AI_API_KEY: ${{ secrets.FASHION_AI_API_KEY }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
      run: |
        docker run -d -p 3000:3000 \
          -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
          -e SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
          -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -e FASHION_AI_API_KEY="${{ secrets.FASHION_AI_API_KEY }}" \
          -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
          -e REVENUECAT_SECRET_KEY="${{ secrets.REVENUECAT_SECRET_KEY }}" \
          -e NODE_ENV=production \
          -e PORT=3000 \
          --name test-container virtual-room-backend:${{ github.sha }}
        
        # Wait for container to be healthy (max 60 seconds)
        echo "Waiting for container to be healthy..."
        for i in {1..12}; do
          if docker inspect --format='{{.State.Health.Status}}' test-container 2>/dev/null | grep -q "healthy"; then
            echo "Container is healthy!"
            break
          fi
          if [ $i -eq 12 ]; then
            echo "Container failed to become healthy"
            docker logs test-container
            docker stop test-container
            docker rm test-container
            exit 1
          fi
          echo "Attempt $i/12: Container not healthy yet, waiting..."
          sleep 5
        done
        
        # Test the endpoint
        echo "Testing endpoint..."
        curl -f http://localhost:3000/ || (docker logs test-container && exit 1)
        
        # Cleanup
        docker stop test-container
        docker rm test-container

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/virtual-room-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/virtual-room-backend:${{ github.sha }}
        platforms: linux/amd64,linux/arm64